pins:
  # Analog Inputs (Strictly 0-3.0V max on SkyStar PRO; PA4-PA7 excluded)
  - id: A0
    class: analog_inputs
    ts_name: CLT (PA0)

  - id: A1
    class: analog_inputs
    ts_name: TPS (PA1)
  
  - id: A2
    class: analog_inputs
    ts_name: Oil Press (PA2)
  
  - id: A3
    class: analog_inputs
    ts_name: MAP (PA3)
  
  - id: B0
    class: analog_inputs
    ts_name: VBatt (PB0)
  
  - id: B1
    class: analog_inputs
    ts_name: Aux ADC (PB1)
  
  - id: C0
    class: analog_inputs
    ts_name: Aux ADC (PC0)
  
  - id: C1
    class: analog_inputs
    ts_name: Aux ADC (PC1)
  
  - id: C2
    class: analog_inputs
    ts_name: Aux ADC (PC2)
  
  - id: C4
    class: analog_inputs
    ts_name: Aux ADC (PC4)
  
  - id: C5
    class: analog_inputs
    ts_name: IAT (PC5)

  # Digital Switch & Trigger / Event Inputs (Only E0, E1, B9, C3, B5, B7)
  - id: [B5, B5]
    class: [switch_inputs, event_inputs]
    ts_name: Input 1 (PB5)
  
  - id: [B7, B7]
    class: [switch_inputs, event_inputs]
    ts_name: Input 2 (PB7)

  - id: [B9, B9]
    class: [switch_inputs, event_inputs]
    ts_name: Input 3 (PB9)
  
  - id: [C3, C3]
    class: [switch_inputs, event_inputs]
    ts_name: Input 4 (PC3)
    
  - id: [E0, E0]
    class: [switch_inputs, event_inputs]
    ts_name: Input 5 (PE0)

  - id: [E1, E1]
    class: [switch_inputs, event_inputs]
    ts_name: Input 6 (PE1)
  
# General Outputs
